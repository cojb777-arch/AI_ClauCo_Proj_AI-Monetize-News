name: デプロイ

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
  # 週次リサーチのワークフローから呼び出される
  workflow_call:
    inputs:
      ref:
        description: 'デプロイするコミット（省略時はトリガー時のSHA）'
        type: string
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── Cloudflare Workers（独自ドメイン想定・base は "/"） ──────────
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: サイトをビルド
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Cloudflare へデプロイ
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy

      - name: シークレット未設定のためスキップ
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN が未設定のため Cloudflare へのデプロイをスキップしました。"

  # ── GitHub Pages（サブディレクトリ配信・base は /<repo>） ────────
  # 前提: Settings → Pages → Source が "GitHub Actions" になっていること。
  # そうなっていない場合、configure-pages が
  # "Get Pages site failed" で失敗するので、設定漏れがすぐ分かる。
  github-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pages の設定を取得
        id: pages
        uses: actions/configure-pages@v5

      - name: サイトをビルド
        env:
          # プロジェクトサイトは https://<user>.github.io/<repo>/ に配信されるため、
          # base パスを渡さないとサイト内リンクがすべて壊れる。
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
