name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npx tsc --noEmit

      - name: サイトをビルド
        run: npm run build

      - name: Worker のバンドルを検証
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-bundle
