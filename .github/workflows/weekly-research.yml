name: 週次リサーチと公開

on:
  schedule:
    # 毎週月曜 09:00 JST（= 00:00 UTC）
    # 注意: schedule はデフォルトブランチ上のワークフローだけが実行されます。
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '記事を生成して検証まで行い、コミット・公開はしない'
        type: boolean
        default: false

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      # claude-code-action は OIDC トークンで認証するため必須。
      # これがないと "Could not fetch an OIDC token" で失敗する。
      id-token: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      # Claude のサブスクリプション枠で動く（APIキー不要）。
      # トークンは手元で `claude setup-token` を実行して発行し、
      # CLAUDE_CODE_OAUTH_TOKEN として Secrets に登録する。
      - name: リサーチと記事生成
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            docs/agent/weekly-research.md を読み、そこに書かれた週次リサーチの手順を最後まで実行してください。

            重要な点:
            - 手順書の「絶対に守るルール」と「完了条件」に従ってください。
            - 変更してよいのは src/content/articles/ への新規追加、data/cases.json、data/rankings.json だけです。
            - 既存の記事ファイルは編集も削除もしないでください。
            - 作業の最後に `node scripts/validate-content.mjs` と `npm run build` を実行し、
              両方が成功することを必ず確認してください。失敗したら直してから再実行してください。
            - git のコミットとプッシュは行わないでください。ワークフロー側で行います。
          claude_args: |
            --model claude-opus-5
            --max-turns 80
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash(node scripts/validate-content.mjs),Bash(npm run build)"

      - name: 生成物を検証
        run: node scripts/validate-content.mjs

      - name: サイトがビルドできることを確認
        run: npm run build

      - name: コミットして公開
        if: ${{ !inputs.dry_run }}
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "ai-monetize-lab-agent"
          git config user.email "actions@github.com"

          # claude-code-action は actions/checkout が保存した認証情報を
          # 自前のGitHub Appトークンで上書きし、終了時にそれを失効させる。
          # そのままでは push が "Invalid username or token" で失敗するため、
          # GITHUB_TOKEN を使う remote に張り直す。
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add src/content/articles data/cases.json data/rankings.json

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更はありませんでした。"
            exit 0
          fi

          SLUG=$(git diff --staged --name-only --diff-filter=A -- src/content/articles \
                  | head -1 | xargs -r basename | sed 's/\.md$//')
          git commit -m "content: 週次リサーチ ${SLUG:-$(date +%Y-%m-%d)}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 生成内容を確認用に出力（dry-run）
        if: ${{ inputs.dry_run }}
        run: |
          echo "### dry-run のためコミットしていません" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain -uall >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in $(git status --porcelain -uall -- src/content/articles | awk '{print $2}'); do
            echo "<details><summary>$f</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '```markdown' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          done

  # GITHUB_TOKEN による push は他のワークフローを起動しないため、
  # デプロイはここから明示的に呼び出す。
  deploy:
    needs: research
    if: ${{ needs.research.outputs.changed == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      ref: ${{ needs.research.outputs.sha }}
